name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Next.js
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: iskcon-deoghar-rg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require App Service name
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "Set repository variable AZURE_WEBAPP_NAME to your App Service name."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build standalone package
        run: ./scripts/prepare-appservice.sh

      - name: Zip package
        run: |
          cd deploy
          zip -qr ../deploy.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path deploy.zip \
            --type zip \
            --async true
